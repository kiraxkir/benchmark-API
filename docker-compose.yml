# Benchmark d'API REST avec MySQL (TP2 MRI).
# Les identifiants viennent du fichier .env (non versionné, voir .env.example).
name: benchmark-api

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Exécutés uniquement au premier démarrage (volume vide), dans la base MYSQL_DATABASE.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    cpus: "2"
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
