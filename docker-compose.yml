# Benchmark d'API REST avec MySQL (TP2 MRI).
# Les identifiants viennent du fichier .env (non versionné, voir .env.example).
name: benchmark-api

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # Durabilité réduite (option b, CLAUDE.md §6) : journal InnoDB écrit à chaque commit mais
      # synchronisé sur disque ~1 fois/s, pas de binlog. Évite que le fsync du disque WSL2
      # (~9 ms par commit mesurés) domine la latence des écritures.
      - --innodb-flush-log-at-trx-commit=2
      - --skip-log-bin
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Exécutés uniquement au premier démarrage (volume vide), dans la base MYSQL_DATABASE.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    cpus: "2"
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # --- Laravel : php-fpm (10 workers) + nginx séparé. "laravel" = point d'entrée (port 8001).
  laravel-fpm:
    build: ./laravel-api
    image: benchmark-laravel:latest
    container_name: laravel-fpm
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    cpus: "2"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy

  laravel:
    image: nginx:alpine
    container_name: laravel-nginx
    volumes:
      - ./laravel-api/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    cpus: "0.5"
    mem_limit: 128m
    depends_on:
      - laravel-fpm

  # --- FastAPI : uvicorn 2 workers, pool aiomysql maxsize=5 par worker (port 8002).
  fastapi:
    build: ./fastapi-api
    image: benchmark-fastapi:latest
    container_name: fastapi-api
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "8002:8000"
    cpus: "2"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy

  # --- Spring Boot : Tomcat par défaut, -Xmx512m, HikariCP 10 connexions (port 8003).
  spring:
    build: ./spring-boot-api
    image: benchmark-spring:latest
    container_name: spring-api
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "8003:8000"
    cpus: "2"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy

  # --- Gin : ReleaseMode, gin.New() + Recovery, database/sql 10 connexions (port 8004).
  gin:
    build: ./gin-api
    image: benchmark-gin:latest
    container_name: gin-api
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "8004:8000"
    cpus: "2"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
