# Configuration de production du benchmark (CLAUDE.md §7). Identifiants fournis par l'environnement.
spring.application.name=benchmark-api
spring.main.banner-mode=off
server.port=8000

# Logs : niveau WARN, pas de log d'accès (désactivé par défaut dans Tomcat embarqué)
logging.level.root=WARN
# Pas de WARN « No mapping » à chaque route inconnue (équivaut à un log par requête)
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
server.tomcat.accesslog.enabled=false

# Erreurs : pas de page Whitelabel, pas de ressources statiques (toute route inconnue -> 404 JSON)
server.error.whitelabel.enabled=false
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

# MySQL via HikariCP : 10 connexions maximum, autocommit (pas de transaction explicite).
# sslMode=DISABLED : comme les 3 autres versions (pas de TLS vers MySQL).
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME}?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
